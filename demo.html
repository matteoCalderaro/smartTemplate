<!DOCTYPE html>
<html lang="it" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BiSmart - Richiedi una Demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="color-bg-primary color-text-primary">

    <nav class="navbar bg-transparent py-4 px-custom">
        <a class="navbar-brand d-flex align-items-center me-auto" href="index.html">
            <img src="logo_trasparente.png" alt="BiSmart Logo" height="70px">
            <h1 class="ms-3 fs-3 fw-bold tracking-tight color-text-primary">bismart.ai <span class="fw-normal fs-5 color-text-secondary">by BiNetwork</span></h1>
        </a>
    </nav>

    <section class="py-5 px-custom">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="card color-bg-card color-border-card p-5 rounded-5">
                        <h2 class="text-center fw-bolder mb-4 color-text-primary">Richiedi una Demo Personalizzata</h2>
                        <form id="demo-form">
                            <!-- Step 1: Application Selection -->
                            <div class="form-step" id="step-1">
                                <h5 class="mb-3 color-text-primary">Seleziona le applicazioni di tuo interesse:</h5>
                                <div class="list-group form-app-selection">
                                    <label class="list-group-item">
                                        <input class="form-check-input me-2" type="checkbox" value="Voice to Insights"> Voice to Insights
                                    </label>
                                    <label class="list-group-item">
                                        <input class="form-check-input me-2" type="checkbox" value="Waq"> Waq
                                    </label>
                                    <label class="list-group-item">
                                        <input class="form-check-input me-2" type="checkbox" value="Smart Pricing"> Smart Pricing
                                    </label>
                                    <label class="list-group-item">
                                        <input class="form-check-input me-2" type="checkbox" value="Stay on"> Stay on
                                    </label>
                                    <label class="list-group-item">
                                        <input class="form-check-input me-2" type="checkbox" value="Sentiment"> Sentiment
                                    </label>
                                    <label class="list-group-item">
                                        <input class="form-check-input me-2" type="checkbox" value="Sales Predict"> Sales Predict
                                    </label>
                                    <label class="list-group-item">
                                        <input class="form-check-input me-2" type="checkbox" value="Wap"> Wap
                                    </label>
                                </div>
                                <div class="d-flex justify-content-end mt-4">
                                    <button type="button" class="btn cta-btn" id="next-step-1">Avanti</button>
                                </div>
                            </div>

                            <!-- Step 2: Personal Data -->
                            <div class="form-step" id="step-2" style="display: none;">
                                <h5 class="mb-3 color-text-primary">Inserisci i tuoi dati:</h5>
                                <div class="mb-3">
                                    <label for="name" class="form-label">Nome e Cognome</label>
                                    <input type="text" class="form-control" id="name" required>
                                </div>
                                <div class="mb-3">
                                    <label for="email" class="form-label">Email Aziendale</label>
                                    <input type="email" class="form-control" id="email" required>
                                </div>
                                <div class="mb-3">
                                    <label for="company" class="form-label">Azienda</label>
                                    <input type="text" class="form-control" id="company">
                                </div>
                                <div class="mb-3">
                                    <label for="phone" class="form-label">Telefono</label>
                                    <input type="tel" class="form-control" id="phone">
                                </div>
                                <div class="d-flex justify-content-between mt-4">
                                    <button type="button" class="btn btn-outline-secondary" id="prev-step-2">Indietro</button>
                                    <button type="button" class="btn cta-btn" id="next-step-2">Avanti</button>
                                </div>
                            </div>

                            <!-- Step 3: Privacy Policy -->
                            <div class="form-step" id="step-3" style="display: none;">
                                <h5 class="mb-3 color-text-primary">Consenso Privacy</h5>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" value="" id="privacy-1" required>
                                    <label class="form-check-label" for="privacy-1">
                                        Dichiaro di aver letto l'informativa sulla privacy e acconsento al trattamento dei miei dati personali.*
                                    </label>
                                </div>
                                <div class="form-check mt-2">
                                    <input class="form-check-input" type="checkbox" value="" id="privacy-2">
                                    <label class="form-check-label" for="privacy-2">
                                        Acconsento a ricevere comunicazioni di marketing e promozionali.
                                    </label>
                                </div>
                                <div class="d-flex justify-content-between mt-4">
                                    <button type="button" class="btn btn-outline-secondary" id="prev-step-3">Indietro</button>
                                    <button type="submit" class="btn cta-btn">Invia Richiesta</button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <footer class="footer color-bg-primary py-4 px-custom">
        <div class="container d-flex flex-column flex-md-row justify-content-between align-items-center">
            <div class="d-flex flex-column flex-md-row align-items-center mb-3 mb-md-0">
                <p class="mb-0 color-text-secondary">&copy; 2025 BiNetwork srl.</p>

            </div>
            <div class="d-flex flex-column flex-md-row align-items-center mb-3 mb-md-0">
                <p class="mb-0 color-text-secondary"><i class="bi bi-telephone-fill me-2"></i>+39 0292100118</p>
                <p class="mb-0 color-text-secondary ms-md-3"><i class="bi bi-envelope-fill me-2"></i>info@binetwork.it</p>
            </div>
            <div class="d-flex gap-3">
                <a href="#" class="social-icon"><i class="bi bi-linkedin"></i></a>
                <a href="#" class="social-icon"><i class="bi bi-instagram"></i></a>
                <a href="#" class="social-icon"><i class="bi bi-facebook"></i></a>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="form.js"></script>
</body>
</html>
