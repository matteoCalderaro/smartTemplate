<!DOCTYPE html>
<html lang="it" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BiSmart - Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #F8F4EE; /* Lighter background for the main page */
            color: #2a4e69; /* Dark text for light background */
        }

        /* Sidebar Styling */
        .sidebar {
            width: 280px;
            background-color: #080c1d; /* Kept dark for contrast */
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #2D3748;
            transition: transform 0.3s ease;
        }

        .sidebar a {
            color: #94A3B8;
            padding: 0.75rem 1rem;
            margin-bottom: 0.5rem;
            border-radius: 0.5rem;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .sidebar a:hover {
            background-color: #1a223a;
            color: #E2E8F0;
        }

        .sidebar a.active {
            background-color: #C59247;
            color: #0d1226;
            font-weight: 600;
        }
        
        /* Main Content Styling */
        .main-content {
            margin-left: 280px;
            padding: 1.5rem;
        }

        /* Navbar Styling */
        .navbar {
            background-color: #E5E7EB; /* Light navbar for contrast with the sidebar */
            border-bottom: 1px solid #C59247;
            position: sticky;
            top: 0;
            z-index: 1000;
            padding: 1rem 1.5rem;
            color: #2a4e69;
        }
        
        .navbar .navbar-brand {
            color: #2a4e69;
        }

        /* Chart card styling */
        .chart-card {
            background-color: #fff;
            color: #2a4e69;
            padding: 2rem;
            border-radius: 1rem;
            border: 1px solid #E5E7EB;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        /* Chart colors from the palette */
        .color-emerald { background-color: #047857; }
        .color-purple { background-color: #6d28d9; }
        .color-red { background-color: #b91c1c; }
        .color-cyan { background-color: #0891b2; }

        /* Simple chart examples using flexbox */
        .bar-chart {
            display: flex;
            align-items: flex-end;
            gap: 1rem;
            height: 200px;
            border-bottom: 2px solid #E5E7EB;
        }
        .bar-chart .bar {
            width: 25%;
            transition: height 0.5s ease;
            position: relative;
        }
        .bar-chart .label {
            position: absolute;
            bottom: -25px;
            width: 100%;
            text-align: center;
            font-size: 0.8rem;
        }

        /* Simple pie chart with a small hack for CSS-only display */
        .pie-chart {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: conic-gradient(
                #047857 0%, #047857 30%, 
                #6d28d9 30%, #6d28d9 60%, 
                #b91c1c 60%, #b91c1c 80%,
                #0891b2 80%, #0891b2 100%
            );
            margin: 0 auto;
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="container-fluid px-0">
            <a class="navbar-brand d-flex align-items-center fw-bold" href="#">
                <img src="logo_trasparente.png" alt="BiSmart Logo" height="50px">
                <span class="ms-2 fs-5">Dashboard</span>
            </a>
            <div class="d-flex align-items-center gap-3">
                <a href="#" class="color-text-gold">
                    <i class="bi bi-bell-fill fs-5"></i>
                </a>
                <a href="#" class="color-text-gold">
                    <i class="bi bi-person-circle fs-5"></i>
                </a>
            </div>
        </div>
    </nav>

    <aside class="sidebar d-none d-lg-flex">
        <a class="d-flex align-items-center text-decoration-none fw-bold mb-4" href="#">
            <img src="logo_trasparente.png" alt="BiSmart Logo" height="60px">
            <h1 class="ms-3 fs-4 tracking-tight" style="color:#C59247;">bismart.ai</h1>
        </a>
        <nav class="nav flex-column flex-grow-1">
            <a class="nav-link d-flex align-items-center gap-2 active" href="#">
                <i class="bi bi-currency-euro"></i>
                <span>Smart Pricing</span>
            </a>
            <a class="nav-link d-flex align-items-center gap-2" href="#">
                <i class="bi bi-graph-up-arrow"></i>
                <span>Sales Predict</span>
            </a>
            <a class="nav-link d-flex align-items-center gap-2" href="#">
                <i class="bi bi-chat-heart-fill"></i>
                <span>Sentiment</span>
            </a>
            <a class="nav-link d-flex align-items-center gap-2" href="#">
                <i class="bi bi-cloud-download"></i>
                <span>Scraping</span>
            </a>
            <a class="nav-link d-flex align-items-center gap-2" href="#">
                <i class="bi bi-mic-fill"></i>
                <span>Voice to Insights</span>
            </a>
            <a class="nav-link d-flex align-items-center gap-2" href="#">
                <i class="bi bi-whatsapp"></i>
                <span>WhatsApp Automation</span>
            </a>
            <a class="nav-link d-flex align-items-center gap-2" href="#">
                <i class="bi bi-person-check-fill"></i>
                <span>Stay on</span>
            </a>
        </nav>
    </aside>

    <main class="main-content">
        <div class="container-fluid">
            <h2 class="fs-1 fw-bold mb-4">Dashboard</h2>
            <div class="row g-4">
                <div class="col-12 col-lg-6">
                    <div class="chart-card">
                        <h4 class="mb-4 fw-semibold">Proiezione Vendite Settimanali</h4>
                        <div class="bar-chart">
                            <div class="bar color-emerald" style="height: 60%;">
                                <span class="label mt-1">Sett. 1</span>
                            </div>
                            <div class="bar color-purple" style="height: 85%;">
                                <span class="label mt-1">Sett. 2</span>
                            </div>
                            <div class="bar color-red" style="height: 45%;">
                                <span class="label mt-1">Sett. 3</span>
                            </div>
                            <div class="bar color-cyan" style="height: 95%;">
                                <span class="label mt-1">Sett. 4</span>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-12 col-lg-6">
                    <div class="chart-card text-center">
                        <h4 class="mb-4 fw-semibold">Distribuzione Clienti</h4>
                        <div class="pie-chart mb-4"></div>
                        <div class="d-flex flex-wrap justify-content-center gap-3">
                            <div class="d-flex align-items-center gap-2">
                                <div class="rounded-circle color-emerald" style="width: 12px; height: 12px;"></div>
                                <span class="small">Nuovi (30%)</span>
                            </div>
                            <div class="d-flex align-items-center gap-2">
                                <div class="rounded-circle color-purple" style="width: 12px; height: 12px;"></div>
                                <span class="small">Esistenti (30%)</span>
                            </div>
                            <div class="d-flex align-items-center gap-2">
                                <div class="rounded-circle color-red" style="width: 12px; height: 12px;"></div>
                                <span class="small">Dormienti (20%)</span>
                            </div>
                            <div class="d-flex align-items-center gap-2">
                                <div class="rounded-circle color-cyan" style="width: 12px; height: 12px;"></div>
                                <span class="small">VIP (20%)</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
